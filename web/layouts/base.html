{{/* base is the HTML shell every page renders into. */}}
{{define "base"}}<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{.PageTitle}} - Dev News</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <style>
    /* Collapsed sidebar state - a plain CSS override, not a Tailwind utility. */
    html.sidebar-collapsed #sidebar { width: 76px; }
    html.sidebar-collapsed .sidebar-label { display: none; }
    html.sidebar-collapsed .sidebar-icon-row { justify-content: center; }

    /* Indeterminate progress bar (web/pages/sources.html's "Syncing..." banner) - a plain sliding
       gradient, not tied to real progress. */
    @keyframes indeterminate-progress {
      from { transform: translateX(-100%); }
      to { transform: translateX(300%); }
    }
    .animate-indeterminate { animation: indeterminate-progress 1.2s ease-in-out infinite; }
  </style>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/sidebar.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/source_form.js"></script>
  <script src="/static/js/sources.js"></script>
  <script src="/static/js/login.js"></script>
  <script src="/static/js/htmx.min.js"></script>
</head>
<body class="h-full bg-gray-50 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
{{block "content" .}}{{end}}
</body>
</html>
{{end}}
